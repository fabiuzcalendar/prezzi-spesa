<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prezzi Spesa</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <header>
    <h1>Prezzi Spesa</h1>
    <p>Confronta i prezzi e organizza la tua spesa</p>
  </header>

  <main>

    <button class="home-button" data-action="cerca">
      🔎
      <span>Cerca prezzi</span>
    </button>

    <button class="home-button" data-action="aggiungi">
      ➕
      <span>Aggiungi prezzo</span>
    </button>

    <button class="home-button" data-action="lista">
      🛒
      <span>Lista della spesa</span>
    </button>

    <button class="home-button" data-action="aggiorna">
      🕒
      <span>Prezzi da aggiornare</span>
    </button>

    <p id="status">Versione iniziale dell'app</p>

  </main>

<script src="./db.js"></script>
<script src="./app.js"></script>

</body>
</html>
